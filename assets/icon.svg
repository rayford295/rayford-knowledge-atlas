<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rayford Knowledge Atlas">
  <title>Rayford Knowledge Atlas</title>
  <rect width="64" height="64" rx="14" fill="#111827"/>
  <!-- atlas: a faint globe behind the graph -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>
  <ellipse cx="32" cy="32" rx="9" ry="21" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="11" y1="32" x2="53" y2="32" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <!-- input -> question -> output -->
  <path d="M18 46 L32 32 L46 18" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="46" r="5.4" fill="#f97316" stroke="#111827" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="6.6" fill="#a78bfa" stroke="#111827" stroke-width="1.6"/>
  <circle cx="46" cy="18" r="5.4" fill="#60a5fa" stroke="#111827" stroke-width="1.6"/>
  <!-- two quiet satellites -->
  <circle cx="45" cy="45" r="2" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="19" cy="19" r="2" fill="#ffffff" fill-opacity="0.55"/>
</svg>
